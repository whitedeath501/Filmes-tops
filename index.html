<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Filmes Tops</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #eeeeee;
            margin: 0;
        }

        header {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        nav {
            background-color: #333;
            text-align: center;
            padding: 15px;
        }

        nav button {
            background-color: transparent;
            color: white;
            border: none;
            margin: 0 15px;
            cursor: pointer;
            font-size: 15px;
        }

        nav button:hover {
            color: #ccc;
        }

        main {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        #pesquisa {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 25px;
            border: 1px solid #aaa;
        }

        #filmes {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .filme {
            background-color: white;
            width: 210px;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px #aaa;
        }

        .filme img {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }

        .filme h3 {
            margin-bottom: 5px;
        }

        .filme p {
            color: #555;
        }

        .botoes {
            display: flex;
            gap: 5px;
        }

        .botoes button {
            background-color: #333;
            color: white;
            border: none;
            padding: 8px;
            cursor: pointer;
        }

        .botoes button:hover {
            background-color: #555;
        }

        .favoritado {
            background-color: green !important;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

    </style>
</head>


<body>

    <header id="inicio">

        <h1>🎬 Filmes Tops</h1>

        <p>Os melhores filmes para assistir</p>

    </header>


    <nav>

        <button onclick="voltarInicio()">Início</button>

        <button onclick="mostrarTodos()">Todos os filmes</button>

        <button onclick="filtrarFavoritos()">Favoritos</button>

    </nav>


    <main>

        <h2>Filmes mais tops</h2>

        <input
            type="text"
            id="pesquisa"
            placeholder="Digite o nome de um filme..."
            onkeyup="pesquisar()"
        >


        <section id="filmes">


            <div class="filme">

                <img src="https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg">

                <h3>Interestelar</h3>

                <div class="botoes">

                    <button onclick="favoritar(this)">
                        Favoritar
                    </button>

                    <button onclick="verDescricao('Interestelar')">
                        Info
                    </button>

                </div>

            </div>


            <div class="filme">

                <img src="https://image.tmdb.org/t/p/w500/74xTEgt7R36Fpooo50r9T25onhq.jpg">

                <h3>Batman</h3>

                <div class="botoes">

                    <button onclick="favoritar(this)">
                        Favoritar
                    </button>

                    <button onclick="verDescricao('Batman')">
                        Info
                    </button>

                </div>

            </div>


            <div class="filme">

                <img src="https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg">

                <h3>Vingadores: Ultimato</h3>


                <div class="botoes">

                    <button onclick="favoritar(this)">
                        Favoritar
                    </button>

                    <button onclick="verDescricao('Vingadores: Ultimato')">
                        Info
                    </button>

                </div>

            </div>


            <div class="filme">

                <img src="https://image.tmdb.org/t/p/w500/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg">

                <h3>Homem-Aranha</h3>

                <div class="botoes">

                    <button onclick="favoritar(this)">
                        Favoritar
                    </button>

                    <button onclick="verDescricao('Homem-Aranha')">
                        Info
                    </button>

                </div>

            </div>


            <div class="filme">

                <img src="https://image.tmdb.org/t/p/w500/q6y0Go1tsGEsmtFryDOJo3dEmqu.jpg">

                <h3>Um Sonho de Liberdade</h3>

                <div class="botoes">

                    <button onclick="favoritar(this)">
                        Favoritar
                    </button>

                    <button onclick="verDescricao('Um Sonho de Liberdade')">
                        Info
                    </button>

                </div>

            </div>


            <div class="filme">

                <img src="https://image.tmdb.org/t/p/w500/9cqNxx0GxF0bflZmeSMuL5tnGzr.jpg">

                <h3>O Poderoso Chefão</h3>

                <div class="botoes">

                    <button onclick="favoritar(this)">
                        Favoritar
                    </button>

                    <button onclick="verDescricao('O Poderoso Chefão')">
                        Info
                    </button>

                </div>

            </div>


        </section>

    </main>



    <script>

        function favoritar(botao) {

            if (botao.innerHTML == "Favoritar") {

                botao.innerHTML = "Favoritado";
                botao.classList.add("favoritado");

            } else {

                botao.innerHTML = "Favoritar";
                botao.classList.remove("favoritado");

            }

        }
        function pesquisar() {

            let texto = document.getElementById("pesquisa").value.toLowerCase();

            let filmes = document.querySelectorAll(".filme");

            filmes.forEach(function(filme) {

                let nome = filme.querySelector("h3").innerText.toLowerCase();

                if (nome.includes(texto)) {

                    filme.style.display = "block";

                } else {

                    filme.style.display = "none";

                }

            });

        }
        function mostrarTodos() {

            let filmes = document.querySelectorAll(".filme");

            filmes.forEach(function(filme) {

                filme.style.display = "block";

            });

            document.getElementById("pesquisa").value = "";

        }
        function filtrarFavoritos() {

            let filmes = document.querySelectorAll(".filme");

            filmes.forEach(function(filme) {

                let botao = filme.querySelector(".favoritado");

                if (botao) {

                    filme.style.display = "block";

                } else {

                    filme.style.display = "none";

                }

            });

        }
        function verDescricao(filme) {

            if (filme == "Interestelar") {

                alert("Interestelar: Um grupo de astronautas viaja pelo espaço procurando um novo planeta para a humanidade.");

            } else if (filme == "Batman") {

                alert("Batman: Bruce Wayne enfrenta o crime e tenta proteger Gotham City.");

            } else if (filme == "Vingadores: Ultimato") {

                alert("Vingadores: Ultimato: Os heróis tentam reverter os acontecimentos causados por Thanos.");

            } else if (filme == "Homem-Aranha") {

                alert("Homem-Aranha: Peter Parker precisa aprender a lidar com seus poderes e responsabilidades.");

            } else if (filme == "Um Sonho de Liberdade") {

                alert("Um Sonho de Liberdade: Um homem condenado à prisão mantém a esperança durante muitos anos.");

            } else {

                alert("O Poderoso Chefão: A história de uma das famílias mais importantes da máfia italiana.");

            }

        }

        function voltarInicio() {

            window.scrollTo(0, 0);

            mostrarTodos();

        }

    </script>

</body>

</html>
